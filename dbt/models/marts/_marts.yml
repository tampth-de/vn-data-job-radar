version: 2

models:
  - name: fct_job_postings
    description: >
      One row per job posting (all sources) with lifecycle (first/last seen, active in
      its source's latest run) and latest attributes.
    columns:
      - name: job_key
        data_tests: [unique, not_null]
      - name: posting_key
        description: Shared by the same ad found on several sources. Count postings with count(distinct posting_key).
        data_tests: [not_null]
      - name: duplicate_of
        description: The canonical job_key when this row is the same ad as a job on another source.
      - name: first_seen_date
        data_tests: [not_null]
      - name: last_seen_date
        data_tests: [not_null]
      - name: salary_min_low_vnd
        description: >
          Minimum salary (VND/month). Exact for CareerLink; for TopDev's masked values
          ("1*******") the lowest possible minimum (salary_is_masked = true).
      - name: salary_max_high_vnd
        description: Maximum salary (VND/month). Exact for CareerLink; highest possible maximum for TopDev.

  - name: dim_job_history
    description: >
      SCD type 2 history of each job posting: one row per version, a new version
      whenever a tracked attribute (title, salary, levels, experience, work mode,
      location, skills) changes. Derived from daily snapshots (gaps-and-islands).
    data_tests:
      - unique_combination:
          arguments:
            columns: [job_key, version_number]
    columns:
      - name: job_version_key
        data_tests: [unique, not_null]
      - name: valid_from
        data_tests: [not_null]
      - name: job_key
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_job_postings')
                field: job_key

  - name: bridge_job_skills
    description: One row per job and canonical skill (aliases merged via the skill_dictionary seed).
    data_tests:
      - unique_combination:
          arguments:
            columns: [job_key, skill]
    columns:
      - name: job_key
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_job_postings')
                field: job_key
      - name: skill_category
        data_tests: [not_null]

  - name: agg_skill_demand_daily
    description: Number and share of Data/AI postings (all sources) requiring each canonical skill, per day.
    data_tests:
      - unique_combination:
          arguments:
            columns: [snapshot_date, skill]
    columns:
      - name: pct_of_jobs
        data_tests: [not_null]
