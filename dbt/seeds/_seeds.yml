version: 2

seeds:
  - name: topdev_level_map
    description: >
      Our own mapping of TopDev's Vietnamese seniority labels to English levels.
      The API does not translate these labels (checked with locale=en_US), so this
      mapping is an assumption documented here.
    columns:
      - name: level_vi
        data_tests: [unique, not_null]
      - name: level_rank
        description: 1 = Intern ... 7 = Director, 0 = any level.

  - name: role_rules
    description: >
      Ordered, case-insensitive regex rules on "title | source category" to assign a
      role family. The first matching rule (lowest rule_order) wins. `non_data` comes
      first to drop sales/marketing jobs that only mention "data" (e.g. "Data có sẵn" =
      lead lists).
    columns:
      - name: rule_order
        data_tests: [unique, not_null]
      - name: role_family
        data_tests: [unique, not_null]

  - name: skill_dictionary
    description: >
      Maps raw skill tags (lower-cased, trimmed) to a canonical skill and a category.
      Unmapped tags are reported by the warning-level test assert_skills_are_categorized.
      text_match = true means the alias is also searched as a whole word in job
      descriptions; it is false for ambiguous words ("ai" is Vietnamese for "who",
      "go", "r", "sales", ...).
    config:
      column_types:
        text_match: boolean
    columns:
      - name: alias
        data_tests: [unique, not_null]
      - name: skill
        data_tests: [not_null]
      - name: skill_category
        data_tests:
          - accepted_values:
              arguments:
                values: ['language', 'database', 'big_data', 'cloud', 'devops', 'bi_analytics',
                         'ml_ai', 'web', 'role_tag', 'soft_skill', 'business', 'other']

  - name: fx_rates
    description: Approximate fixed exchange rates used to compare salaries in VND. Update manually.
    columns:
      - name: currency
        data_tests: [unique, not_null]
