name: radar
version: "0.1.0"
config-version: 2
profile: radar

model-paths: ["models"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
test-paths: ["tests"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

# Postgres contrib extensions used for cross-source deduplication:
# unaccent (strip Vietnamese accents) and pg_trgm (trigram similarity).
on-run-start:
  - "create extension if not exists unaccent with schema public"
  - "create extension if not exists pg_trgm with schema public"

models:
  radar:
    staging:
      +schema: staging
      +materialized: view
    intermediate:
      +schema: intermediate
      +materialized: view
    marts:
      +schema: marts
      +materialized: table

seeds:
  radar:
    +schema: reference
