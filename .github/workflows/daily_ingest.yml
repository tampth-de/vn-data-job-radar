# Daily ingestion: run the scrapers and commit the raw files to a PRIVATE data repo.
#
# Required repository secret:
#   DATA_REPO_TOKEN  fine-grained token with "Contents: Read and write"
#                    on the private data repo only.
# Required repository variable (Settings > Secrets and variables > Actions > Variables):
#   DATA_REPO        e.g. tampth-de/vn-data-job-radar-data

name: Daily ingest

on:
  schedule:
    - cron: "0 1 * * *"   # 01:00 UTC = 08:00 Vietnam time
  workflow_dispatch:       # allow manual runs from the Actions tab

concurrency:
  group: daily-ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Check out private data repo into ./data
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DATA_REPO }}
          token: ${{ secrets.DATA_REPO_TOKEN }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest -q

      - name: Ingest TopDev
        run: python -m ingestion.topdev.fetch_jobs

      - name: Commit raw data to data repo
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "ingest: $(date -u +%Y-%m-%d)"
          git push
