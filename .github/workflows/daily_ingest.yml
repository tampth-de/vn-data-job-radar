# Daily ingestion: run the scrapers and commit the raw files to a PRIVATE data repo.
#
# Required repository secret:
#   DATA_REPO_SSH_KEY  private half of an SSH deploy key. The public half is added
#                      to the data repo as a deploy key with write access, so this
#                      key can only touch that one repository.
# Required repository variable (Settings > Secrets and variables > Actions > Variables):
#   DATA_REPO          e.g. tampth-de/vn-data-job-radar-data

name: Daily ingest

on:
  schedule:
    # 00:23 UTC = 07:23 Vietnam time. An odd minute on purpose: runs scheduled at the
    # top of the hour queue behind everyone else's and were starting 7h late.
    - cron: "23 0 * * *"
  workflow_dispatch:       # allow manual runs from the Actions tab

concurrency:
  group: daily-ingest
  cancel-in-progress: false

# Least privilege: the ingest job only reads this repo (it writes to the data repo
# through its own deploy key); only the deploy job may publish to GitHub Pages.
permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Throwaway warehouse used to validate the full history after each ingest.
    services:
      warehouse:
        image: postgres:17
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radar
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U radar -d radar"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_USER: radar
      WAREHOUSE_PASSWORD: radar
      WAREHOUSE_DB: radar

    steps:
      - name: Check out code
        uses: actions/checkout@v7

      - name: Check out private data repo into ./data
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.DATA_REPO }}
          ssh-key: ${{ secrets.DATA_REPO_SSH_KEY }}
          path: data

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        id: tests
        run: python -m pytest -q

      # Each source runs even if another source failed (one broken site must not
      # block the others), but nothing runs if the unit tests failed.
      - name: Ingest TopDev
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m ingestion.topdev.fetch_jobs

      # ~10 search pages + new job pages only (5 s apart, capped, stops if throttled)
      - name: Ingest CareerLink
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        timeout-minutes: 15
        run: python -m ingestion.careerlink.fetch_jobs

      # ITviec is NOT scheduled: its Terms (2.2) forbid retrieving/downloading content
      # beyond reasonable personal use without written consent, and it blocks cloud IPs.
      # See docs/source_survey.md.

      - name: Commit raw data to data repo
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data to commit."
            exit 0
          fi
          git commit -m "ingest: $(date -u +%Y-%m-%d)"
          git push

      # Raw data is committed first (bronze is kept no matter what), then the whole
      # history is rebuilt and checked. A failed check turns the run red and GitHub
      # emails the repo owner.
      - name: Load full history into the warehouse
        id: load
        if: ${{ !cancelled() && steps.tests.outcome == 'success' }}
        run: python -m load.all

      - name: dbt build + data quality checks
        id: dbt
        if: ${{ !cancelled() && steps.load.outcome == 'success' }}
        working-directory: dbt
        run: |
          dbt build --profiles-dir . --vars '{min_daily_jobs: 10, max_data_age_days: 2}'

      - name: Publish daily summary
        if: ${{ !cancelled() && steps.dbt.outcome == 'success' }}
        run: python -m load.summary >> "$GITHUB_STEP_SUMMARY"

      # Public dashboard: aggregates only (no titles, companies or links), see publish/.
      # Only built when every data test passed, so a bad day never reaches the site.
      - name: Build public site
        id: site
        if: ${{ !cancelled() && steps.dbt.outcome == 'success' }}
        run: python -m publish.build_site --out _site

      - name: Upload site artifact
        if: ${{ !cancelled() && steps.site.outcome == 'success' }}
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy-site:
    needs: ingest
    if: ${{ !cancelled() && needs.ingest.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
