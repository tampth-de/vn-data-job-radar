# Local stack for the project. Start with:  docker compose up -d
services:
  warehouse:
    image: postgres:17
    container_name: radar-warehouse
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-radar}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-radar}
      POSTGRES_DB: ${WAREHOUSE_DB:-radar}
    ports:
      - "5433:5432"   # 5433 on the host: 5432 is taken by the native Windows Postgres
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      - ./docker/warehouse-init:/docker-entrypoint-initdb.d:ro   # creates the `metabase` database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-radar} -d ${WAREHOUSE_DB:-radar}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  dashboard:
    image: metabase/metabase:v0.65.4.3
    container_name: radar-dashboard
    environment:
      # Metabase's own settings live in the `metabase` database of the warehouse
      # container (its default H2 file corrupted its ID sequence).
      MB_DB_TYPE: postgres
      MB_DB_HOST: warehouse
      MB_DB_PORT: "5432"
      MB_DB_DBNAME: metabase
      MB_DB_USER: ${WAREHOUSE_USER:-radar}
      MB_DB_PASS: ${WAREHOUSE_PASSWORD:-radar}
      MB_ANON_TRACKING_ENABLED: "false"
      MB_CHECK_FOR_UPDATES: "false"
      JAVA_TIMEZONE: Asia/Ho_Chi_Minh
    ports:
      - "3000:3000"   # http://localhost:3000
    depends_on:
      warehouse:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
    restart: unless-stopped

volumes:
  warehouse-data:
